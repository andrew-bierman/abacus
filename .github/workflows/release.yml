name: release

# Tag vX.Y.Z (or run manually with a version) to build the four archives with the pinned sidecar
# tools and publish a GitHub release. Needs the repository secret ABACUS_RELEASE_TOKEN: a token
# that can read releases of the (private) beads-lease repository, because the default
# GITHUB_TOKEN cannot read other private repositories. Without it the build fails closed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # package-release.sh builds the Board CLI with bun and refuses any version but the one
      # bundled-tools.json pins; the runner image does not carry it.
      - name: bun version
        id: bun
        run: echo "version=$(jq -r '.tools[] | select(.bun_version) | .bun_version' bundled-tools.json | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: package
        env:
          GH_TOKEN: ${{ secrets.ABACUS_RELEASE_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "secret ABACUS_RELEASE_TOKEN is not set" >&2; exit 1; }
          scripts/package-release.sh "${{ steps.v.outputs.version }}" --out dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          [ -n "$notes" ] || notes="abacus v$VERSION"
          printf '%s\n' "$notes" > dist/notes.md
          gh release create "v$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --title "abacus v$VERSION" --notes-file dist/notes.md --target "$GITHUB_SHA"
