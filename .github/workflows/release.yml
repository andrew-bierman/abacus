name: release

# Tag vX.Y.Z (or run manually with a version) to build the four archives with the pinned sidecar
# tools and publish a GitHub release. Dependency downloads are anonymous unless the optional
# ABACUS_RELEASE_TOKEN secret is set.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # package-release.sh builds the Board CLI with bun and refuses any version but the one
      # bundled-tools.json pins; the runner image does not carry it.
      - name: bun version
        id: bun
        run: echo "version=$(jq -r '.tools[] | select(.bun_version) | .bun_version' bundled-tools.json | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: package
        env:
          GH_TOKEN: ${{ secrets.ABACUS_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then export ABACUS_PUBLIC_DOWNLOADS=1; fi
          scripts/package-release.sh "${{ steps.v.outputs.version }}" --out dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          [ -n "$notes" ] || notes="abacus v$VERSION"
          printf '%s\n' "$notes" > dist/notes.md
          assets=(dist/*.tar.gz dist/SHA256SUMS)
          if [ -f dist/EMBEDDED_TOOLS.md ]; then assets+=(dist/EMBEDDED_TOOLS.md); fi
          gh release create "v$VERSION" "${assets[@]}" \
            --title "abacus v$VERSION" --notes-file dist/notes.md --target "$GITHUB_SHA"
