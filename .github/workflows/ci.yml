name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh scripts/lib/*.sh
      # Tests use fakes, fixtures and isolated temp dirs. The real-bd tests skip when bd is absent.
      - name: test
        env:
          HOME: ${{ runner.temp }}/home
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          mkdir -p "$HOME" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          go test ./...
      # The embedtools build needs generated blobs (fetched with gh, built with npm and bun), which
      # this job does not make: the script says so and skips. Run it locally after make build.
      - name: tagged build (skips without blobs)
        env:
          HOME: ${{ runner.temp }}/home
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: scripts/check-embedtools.sh
