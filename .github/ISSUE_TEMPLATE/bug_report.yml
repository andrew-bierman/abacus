name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem do not use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or keys, and the smallest tracker that shows it. Remove real names and data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: abacus version
      description: Output of `abacus version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and terminal
      placeholder: macOS 15 arm64, Ghostty
  - type: textarea
    id: doctor
    attributes:
      label: abacus doctor output
      render: text
